# -----------------------------------------------------------
# 📘 BASE CONFIGURATION for NewBitcoin
# -----------------------------------------------------------
server=1                # Enable server mode (RPC accessible)

# -----------------------------------------------------------
# ⚡ ZMQ (pour ckpool - notification instantanée des blocs)
# -----------------------------------------------------------
zmqpubhashblock=tcp://127.0.0.1:28332
zmqpubrawblock=tcp://127.0.0.1:28332
#reindex=1
txindex=1               # Build full transaction index for explorers

# -----------------------------------------------------------
# 🔐 RPC CONFIGURATION
# -----------------------------------------------------------
rpcbind=0.0.0.0    
rpcallowip=192.168.1.0/24    # Only allow RPC connections from localhost
rpcport=8332            # Port for RPC server

rpcallowip=192.168.1.0/24
disablewallet=0
# You must define either rpcauth or rpcuser/password (for ElectrumX)
rpcuser=user
rpcpassword=password
#rpcookiefile=.cookie
# Alternatively (more secure):
# rpcauth=papa:8e9a2b1d0c5f6e7d8c9a0b1c2d3e4f5$d3b07384d113edec49eaa6238ad5ff00
rest=1
# -----------------------------------------------------------
# 🌍 NETWORK CONFIGURATION
# -----------------------------------------------------------
listen=1                # Accept peer connections
port=9333               # P2P network port
maxconnections=38       # Limit number of peer connections
maxtipage=999999999




# Optional external IP if behind NAT
# externalip=

# Bind manually to interfaces (IPv4/IPv6)
# bind=0.0.0.0:9333

# -----------------------------------------------------------
# 🌐 PEERS / ADDNODES
# Add your fixed peers below (IPv4, IPv6, DNS, etc.)
# -----------------------------------------------------------
addnode=e7p7dtn3c4olvgd37sql5bmmn43hiqegajgsa6js5di3z7xgjea6zhad.onion
addnode=35.192.122.53
addnode=192.168.1.135
addnode=newbitcoin1.ddns.net
addnode=newbitcoin.ddns.net
addnode=82.66.103.79
addnode=2a01:e0a:10e:8130:8d1d:322:82f7:e4fc
addnode=2a0d:e487:115f:eb38:1312:bbf7:cd35:d39e
addnode=2a0d:e487:115f:eb38:61e7:68ea:3992:c88d








# -----------------------------------------------------------
# 🌐 PEER DISCOVERY + ROUTEUR
# -----------------------------------------------------------
upnp=1                 # Enable automatic port forwarding
natpmp=1               # Apple routers / NAT-PMP
dnsseed=1              # Enable DNS-based peer discovery
listenonion=1          # Support Tor hidden services

# -----------------------------------------------------------
# 🧾 LOGGING / DEBUG
# -----------------------------------------------------------
debug=0                # Verbose logging
logips=0               # Show peer IPs in log
logtimestamps=0        # Show timestamps

# -----------------------------------------------------------
# 📦 WALLETS / MINING
# -----------------------------------------------------------
fallbackfee=0.0001     # Fallback fee for transactions

# Enable wallet support (default)
# disablewallet=0
# gen=1                 # Enable CPU mining (if needed)
# keypool=100
# wallet=wallet.dat

# -----------------------------------------------------------
# 🔒 ACCESS CONTROL
# -----------------------------------------------------------
whitelist=127.0.0.1          # Allow RPC from localhost
whitelist=192.168.1.0/24     # Allow RPC from local network

# -----------------------------------------------------------
# ⚙️ PERFORMANCE
# -----------------------------------------------------------
dbcache=450                 # DB cache in MB
maxmempool=300              # Max mempool in MB
minrelaytxfee=0.00001000    # Minimum fee per KB to relay tx

# -----------------------------------------------------------
# 🧱 OPTIONAL: BLOCK PRUNING / RELAY / BANNING
# -----------------------------------------------------------
# prune=1000                 # Enable pruning, keep last 1000 blocks
# blocksonly=0               # Relay only blocks, not txs
# banscore=100
# bantime=86400
# maxorphantx=100
# bantime=86400
# maxorphantx=100
